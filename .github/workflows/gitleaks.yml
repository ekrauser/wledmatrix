# Secret scanning on every push to the default branch and every pull request.
# Free for personal repositories (GITLEAKS_LICENSE is only needed for orgs).
# Added account-wide on 2026-09-21 after a history sweep found committed keys in
# older repos. A repo-specific allowlist, if ever needed, goes in .gitleaks.toml.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

# pull-requests:read is required on pull_request events: the action lists the
# PR's commits through the API to compute the scan range.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
